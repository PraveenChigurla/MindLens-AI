services:
  # 1. FastAPI Backend
  - type: web
    name: mindlens-backend
    env: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: PORT
        value: 10000

  # 2. Next.js Frontend
  - type: web
    name: mindlens-frontend
    env: node
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm start"
    envVars:
      - key: NODE_VERSION
        value: 20.9.0
      - key: API_BASE_URL
        fromService:
          type: web
          name: mindlens-backend
          envVarKey: RENDER_EXTERNAL_URL
